<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="1180" cy="60" r="140" fill="#38bdf8" opacity="0.06"/>
  <circle cx="90" cy="380" r="160" fill="#a78bfa" opacity="0.06"/>

  <text x="80" y="118" font-size="54" font-weight="700" fill="#f8fafc">supervisor-outreach-team</text>
  <text x="80" y="162" font-size="24" fill="#94a3b8">Four Claude Code agents that find, study, assess, and write to research supervisors.</text>
  <text x="80" y="196" font-size="24" fill="#94a3b8">Every fact sourced. Every email unique. Nothing is ever sent for you.</text>

  <g font-size="20" font-weight="600" text-anchor="middle">
    <g transform="translate(80,250)">
      <rect width="230" height="84" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <text x="115" y="36" fill="#e0f2fe">1 · Administrator</text>
      <text x="115" y="62" font-size="15" font-weight="400" fill="#7dd3fc">finds professors</text>
    </g>
    <line x1="318" y1="292" x2="382" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(390,250)">
      <rect width="230" height="84" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
      <text x="115" y="36" fill="#dcfce7">2 · Researcher</text>
      <text x="115" y="62" font-size="15" font-weight="400" fill="#86efac">reads their papers</text>
    </g>
    <line x1="628" y1="292" x2="692" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(700,250)">
      <rect width="230" height="84" rx="14" fill="#713f12" stroke="#fbbf24" stroke-width="2"/>
      <text x="115" y="36" fill="#fef3c7">3 · Reviewer</text>
      <text x="115" y="62" font-size="15" font-weight="400" fill="#fcd34d">scores the fit honestly</text>
    </g>
    <line x1="938" y1="292" x2="1002" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1010,250)">
      <rect width="190" height="84" rx="14" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
      <text x="95" y="36" fill="#ede9fe">4 · Task Handler</text>
      <text x="95" y="62" font-size="15" font-weight="400" fill="#c4b5fd">drafts the email</text>
    </g>
  </g>
  <text x="80" y="374" font-size="15" fill="#64748b">/outreach &lt;university or country&gt; [field]   →   data/drafts/*.md   →   you read, edit, and send</text>
</svg>
